http_port 3128

acl CONNECT method CONNECT
acl SSL_ports port 443
acl openai_domains dstdomain .openai.com .chatgpt.com .oaistatic.com .oaiusercontent.com

http_access deny CONNECT !SSL_ports
http_access allow CONNECT openai_domains SSL_ports
http_access deny all

cache deny all
access_log none
pid_filename none
